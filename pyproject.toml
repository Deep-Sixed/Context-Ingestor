[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stele"
version = "0.1.0"
description = "Parser containment boundary and artifact ledger for EVECOR DataCore"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Wasm/WASI sandbox backend (stele.containment.wasm). The API used (fuel,
# epoch interruption, read-only preopens via fs_mutable) needs wasmtime 49+.
wasm = ["wasmtime>=49"]
dev = ["pytest>=8", "wasmtime>=49"]

[tool.hatch.build.targets.wheel]
packages = ["stele"]

[tool.pytest.ini_options]
testpaths = ["tests"]
