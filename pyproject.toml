[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stele"
version = "0.1.0"
description = "Parser containment boundary and artifact ledger for EVECOR DataCore"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["stele"]

[tool.pytest.ini_options]
testpaths = ["tests"]
